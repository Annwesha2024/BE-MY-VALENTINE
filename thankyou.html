<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Thank You My Love 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

  <!-- Lottie Player -->
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      height: 100vh;
      background: black;
      color: #ff9ecb;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }

    /* 🌌 Twinkling stars */
    

    @keyframes twinkle {
      from { opacity: 0.7; }
      to { opacity: 0.9; }
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 15px;
      text-shadow: 0 0 20px #ff9ecb;
    }

    p {
      font-size: 1.15rem;
      max-width: 650px;
      margin-bottom: 25px;
      line-height: 1.7;
    }

    lottie-player {
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <!-- 🎶 Background Music -->
  <audio id="bg-music" autoplay loop>
    <source src="song1.mp3" type="audio/mpeg">
  </audio>

  <script>
    const music = document.getElementById("bg-music");
    let started = false;

    function startMusic() {
      if (!started) {
        music.play();
        started = true;
      }
    }

    window.addEventListener("click", startMusic);
  </script>

  <h1>Thank you for choosing me 💕</h1>

  <p>
    Every moment with you feels like home.  
    I promise to keep loving you in all the quiet ways,  
    and all the loud ones too.
  </p>

  <!-- 💑 Lottie Animation -->
  <lottie-player
    src="kiss.json"
    background="transparent"
    speed="1"
    loop
    autoplay
    style="width:300px; height:300px;">
  </lottie-player>

</body>
</html>
